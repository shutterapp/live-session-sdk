title = "Live Session SDK secret scanning"
betterleaksMinVersion = "1.10.1"

# Dependencies, downloaded models and generated output are not maintained source.
prefilter = '''
filter.matchesAny(attributes["path"], [
  `(?:^|/)(?:node_modules|dist|\.git|models)(?:/|$)`
])
'''

[extend]
useDefault = true

[[rules]]
id = "live-session-guest-token"
description = "Live Session guest invitation credential"
regex = '''(?i)[?&]g=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords = ["g="]
